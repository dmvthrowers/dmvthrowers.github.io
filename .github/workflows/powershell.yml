name: PowerShell

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Analyze PowerShell scripts
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer and create SARIF
        shell: pwsh
        run: |
          $resultsPath = Join-Path $PWD "powershell-results.sarif"
          Invoke-ScriptAnalyzer -Path . -Recurse -OutputFormat Sarif -OutputPath $resultsPath

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: powershell-results.sarif
          category: "/workflow:powershell"
