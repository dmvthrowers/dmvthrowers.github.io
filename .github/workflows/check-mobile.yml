# Fails if any page scrolls sideways on a 360px phone screen. See scripts/check_mobile.js.
# Runs on pull requests, and is called by the deploy workflow (static.yml) before every deploy.
name: Check mobile

on:
  pull_request:
    branches: ["main"]
  workflow_call:

# Least privilege: the check only reads the code.
permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Get a browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check every page at 360px
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node scripts/check_mobile.js
