name: Labeler

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on: [pull_request_target]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
    - name: Create labels if missing
      uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
      with:
        script: |
          const labels = [
            { name: 'content',  color: '0075ca', description: 'HTML content changes' },
            { name: 'assets',   color: 'd93f0b', description: 'Asset file changes' },
            { name: 'ci',       color: 'e4e669', description: 'CI / workflow changes' },
          ];
          for (const label of labels) {
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ...label,
              });
            } catch (e) {
              if (e.status !== 422) throw e; // 422 = label already exists
            }
          }

    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        sync-labels: false
