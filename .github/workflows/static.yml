# Deploys the site to GitHub Pages, but only after the site, HTML and mobile checks pass.
# A failing check stops the deploy and the live site stays as it was.
# Break glass: Actions > Deploy static content to Pages > Run workflow > "Skip checks" deploys
# without them. Use it only when a check itself is broken and a fix has to go live.
name: Deploy static content to Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Manual runs from the Actions tab. The meetup bot also starts one after it pushes, because
  # pushes made with GITHUB_TOKEN don't trigger other workflows.
  workflow_dispatch:
    inputs:
      skip_checks:
        description: "Skip checks (break glass: only when a check itself is broken)"
        type: boolean
        default: false

# Least privilege by default; only the deploy job gets Pages rights.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  site:
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/check-site.yml
  html:
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/validate-html.yml
  mobile:
    if: ${{ !inputs.skip_checks }}
    uses: ./.github/workflows/check-mobile.yml

  deploy:
    needs: [site, html, mobile]
    # Deploy when every check passed, or when they were skipped on purpose.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Stage site files
        # Publish only website content — keep repo docs, agent configs,
        # editor settings, and print masters out of the public deploy.
        run: |
          mkdir -p /tmp/site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.vscode/' \
            --exclude='agents/' \
            --exclude='skills/' \
            --exclude='scripts/' \
            --exclude='*.md' \
            --exclude='*.ps' \
            --exclude='.gitignore' \
            --exclude='.pre-commit-config.yaml' \
            --exclude='environment.yml' \
            --exclude='LICENSE' \
            ./ /tmp/site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: '/tmp/site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
