<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 100" aria-hidden="true">
  <!-- === JEFFERSON MEMORIAL (far left) – rotunda dome on steps === -->
  <rect x="72"  y="82" width="96" height="6"  fill="white"/>
  <rect x="80"  y="71" width="80" height="12" fill="white"/>
  <ellipse cx="120" cy="67" rx="26" ry="12"   fill="white"/>
  <rect x="113" y="55" width="14" height="13" fill="white"/>

  <!-- === Background buildings, far left === -->
  <rect x="8"   y="50" width="18" height="38" fill="white"/>
  <rect x="30"  y="42" width="22" height="46" fill="white"/>
  <rect x="56"  y="58" width="16" height="30" fill="white"/>

  <!-- === Mid-left buildings === -->
  <rect x="185" y="52" width="20" height="36" fill="white"/>
  <rect x="209" y="44" width="16" height="44" fill="white"/>
  <rect x="230" y="58" width="24" height="30" fill="white"/>
  <rect x="258" y="48" width="18" height="40" fill="white"/>

  <!-- === LINCOLN MEMORIAL – wide pediment triangle, flat colonnade === -->
  <rect x="288" y="80" width="146" height="6"  fill="white"/>
  <rect x="294" y="75" width="132" height="6"  fill="white"/>
  <rect x="298" y="62" width="124" height="14" fill="white"/>
  <polygon points="292,62 360,43 428,62"        fill="white"/>

  <!-- === Connecting buildings toward White House === -->
  <rect x="452" y="60" width="22" height="28" fill="white"/>
  <rect x="478" y="68" width="32" height="20" fill="white"/>

  <!-- === WHITE HOUSE – low symmetrical block + portico pediment === -->
  <rect x="516" y="72" width="148" height="16" fill="white"/>
  <rect x="558" y="64" width="64"  height="9"  fill="white"/>
  <polygon points="554,64 590,53 626,64"         fill="white"/>
  <rect x="476" y="74" width="44"  height="12" fill="white"/>
  <rect x="660" y="74" width="44"  height="12" fill="white"/>

  <!-- === WASHINGTON MONUMENT – centerpiece obelisk === -->
  <polygon points="700,4 708,44 692,44"          fill="white"/>
  <rect x="692" y="44" width="16" height="44"   fill="white"/>

  <!-- === Buildings east toward Capitol === -->
  <rect x="726" y="54" width="20" height="34" fill="white"/>
  <rect x="750" y="46" width="18" height="42" fill="white"/>
  <rect x="773" y="60" width="26" height="28" fill="white"/>
  <rect x="804" y="50" width="18" height="38" fill="white"/>
  <rect x="828" y="64" width="22" height="24" fill="white"/>

  <!-- === CAPITOL BUILDING – dome + lantern + wings === -->
  <rect x="856" y="72" width="210" height="16" fill="white"/>
  <rect x="896" y="64" width="128" height="10" fill="white"/>
  <rect x="938" y="50" width="46"  height="16" fill="white"/>
  <ellipse cx="961" cy="48" rx="31" ry="20"    fill="white"/>
  <rect x="957" y="26" width="8"   height="22" fill="white"/>
  <polygon points="961,20 966,26 956,26"         fill="white"/>

  <!-- === LIBRARY OF CONGRESS – classical pediment === -->
  <polygon points="1082,64 1140,46 1198,64"      fill="white"/>
  <rect x="1086" y="64" width="108" height="24" fill="white"/>
  <rect x="1042" y="54" width="22"  height="34" fill="white"/>
  <rect x="1068" y="46" width="16"  height="42" fill="white"/>

  <!-- === WASHINGTON NATIONAL CATHEDRAL – Gothic spires === -->
  <rect x="1228" y="38" width="24" height="50" fill="white"/>
  <polygon points="1240,18 1248,38 1232,38"      fill="white"/>
  <rect x="1204" y="50" width="18" height="38" fill="white"/>
  <polygon points="1213,34 1220,50 1206,50"      fill="white"/>
  <rect x="1258" y="46" width="18" height="42" fill="white"/>
  <polygon points="1267,30 1274,46 1260,46"      fill="white"/>

  <!-- === Far-right fill buildings === -->
  <rect x="1284" y="60" width="20" height="28" fill="white"/>
  <rect x="1308" y="66" width="24" height="22" fill="white"/>
  <rect x="1336" y="56" width="18" height="32" fill="white"/>
  <rect x="1358" y="64" width="20" height="24" fill="white"/>
  <rect x="1382" y="52" width="18" height="36" fill="white"/>

  <!-- === Ground === -->
  <rect x="0" y="88" width="1400" height="12" fill="white"/>
</svg>
