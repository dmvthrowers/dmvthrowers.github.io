<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Tracing · DMV Throwers</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Verdana, Geneva, Tahoma, sans-serif; color: #111; background: #fff; margin: 0; padding: 20px; }
  .page { max-width: 7.5in; margin: 0 auto; }
  .print-btn { display: inline-block; font-size: 18px; padding: 10px 22px; border: 3px solid #111; background: #fff; border-radius: 8px; cursor: pointer; margin-bottom: 12px; font-family: inherit; font-weight: bold; }
  .print-btn:hover { background: #eee; }
  .header { text-align: center; border-bottom: 4px double #111; padding-bottom: 10px; margin-bottom: 8px; }
  .club { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
  h1 { font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; font-size: 34px; margin: 8px 0 4px; }
  .instr { font-size: 20px; margin: 4px 0 0; }
  .nameline { display: flex; justify-content: space-between; font-size: 18px; margin: 14px 0 4px; }
  .shapeblock { border: 3px solid #111; border-radius: 12px; padding: 14px 18px; margin: 22px 0; }
  .shapelabel { font-size: 24px; font-weight: bold; margin: 0 0 8px; }
  .shapeblock svg { width: 100%; height: 120px; display: block; }
  .footer { margin-top: 14px; padding-top: 8px; border-top: 2px solid #111; text-align: center; font-size: 13px; }
  @media print {
    .print-btn { display: none !important; }
    body { padding: 0; }
    @page { size: letter; margin: 0.6in; }
    .shapeblock { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">
  <button class="print-btn" onclick="window.print()">&#128438; Print</button>
  <div class="header">
    <div class="club">DMV Throwers &middot; Yo-Yos in the Classroom</div>
    <h1>Big Tracing</h1>
    <p class="instr">Trace each shape. Go slow.</p>
  </div>
  <div class="nameline"><span>Name: ______________________________</span><span>Date: ____________</span></div>

  <div class="shapeblock">
    <p class="shapelabel">1. Circle</p>
    <svg viewBox="0 0 600 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <circle cx="300" cy="60" r="52" fill="none" stroke="#111" stroke-width="10" stroke-dasharray="20,14" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="shapeblock">
    <p class="shapelabel">2. Straight Line</p>
    <svg viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
      <line x1="40" y1="60" x2="560" y2="60" stroke="#111" stroke-width="10" stroke-dasharray="20,14" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="shapeblock">
    <p class="shapelabel">3. Wave</p>
    <svg viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true">
      <path d="M 40 60 Q 110 10, 180 60 T 320 60 T 460 60 T 560 60" fill="none" stroke="#111" stroke-width="10" stroke-dasharray="20,14" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="footer">dmvthrowers.club &middot; Free for classroom and homeschool use.</div>
</div>
</body>
</html>
