<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color the Classic Yo-Yo · DMV Throwers</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Verdana, Geneva, Tahoma, sans-serif; color: #111; background: #fff; margin: 0; padding: 20px; }
  .page { max-width: 7.5in; margin: 0 auto; }
  .print-btn { display: inline-block; font-size: 15px; padding: 8px 18px; border: 2px solid #111; background: #fff; border-radius: 8px; cursor: pointer; margin-bottom: 12px; font-family: inherit; }
  .print-btn:hover { background: #eee; }
  .header { text-align: center; border-bottom: 3px double #111; padding-bottom: 10px; margin-bottom: 10px; }
  .club { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; }
  h1 { font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; font-size: 26px; margin: 8px 0 4px; }
  .instr { font-style: italic; font-size: 13.5px; margin: 0; }
  .nameline { display: flex; justify-content: space-between; font-size: 13px; margin: 12px 0 4px; }
  .art { display: block; margin: 0 auto; max-width: 100%; }
  .footer { margin-top: 14px; padding-top: 8px; border-top: 2px solid #111; text-align: center; font-size: 11px; }
  @media print {
    .print-btn { display: none !important; }
    body { padding: 0; }
    @page { size: letter; margin: 0.6in; }
  }
</style>
</head>
<body>
<div class="page">
  <button class="print-btn" onclick="window.print()">&#128438; Print</button>
  <div class="header">
    <div class="club">DMV Throwers &middot; Yo-Yos in the Classroom</div>
    <h1>Color the Classic Yo-Yo</h1>
    <p class="instr">Grab your crayons or markers and color the classic yo-yo any way you like!</p>
  </div>
  <div class="nameline"><span>Name: ______________________________</span><span>Date: ____________</span></div>

  <svg class="art" viewBox="0 0 400 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Classic yo-yo coloring page">
    <!-- string -->
    <line x1="200" y1="222" x2="200" y2="40" stroke="#111" stroke-width="3"/>
    <ellipse cx="200" cy="27" rx="9" ry="13" fill="none" stroke="#111" stroke-width="3"/>
    <!-- top half -->
    <ellipse cx="200" cy="160" rx="95" ry="62" fill="#fff" stroke="#111" stroke-width="3.5"/>
    <!-- bottom half -->
    <ellipse cx="200" cy="290" rx="95" ry="62" fill="#fff" stroke="#111" stroke-width="3.5"/>
    <!-- axle -->
    <circle cx="200" cy="225" r="9" fill="#fff" stroke="#111" stroke-width="3"/>
    <!-- decorations: star -->
    <path d="M150,128 L155.3,142.7 L170.9,143.2 L158.6,152.8 L162.9,167.8 L150,159 L137.1,167.8 L141.4,152.8 L129.1,143.2 L144.7,142.7 Z"
          fill="none" stroke="#111" stroke-width="2.5"/>
    <!-- decorations: zigzag -->
    <path d="M125,192 l15,-15 l15,15 l15,-15 l15,15 l15,-15 l15,15 l15,-15 l15,15"
          fill="none" stroke="#111" stroke-width="2.5"/>
    <!-- decorations: dots -->
    <circle cx="252" cy="140" r="4.5" fill="none" stroke="#111" stroke-width="2.5"/>
    <circle cx="272" cy="163" r="4.5" fill="none" stroke="#111" stroke-width="2.5"/>
    <circle cx="128" cy="138" r="4.5" fill="none" stroke="#111" stroke-width="2.5"/>
    <!-- decorations: triangles -->
    <path d="M140,312 l12,-20 l12,20 Z M170,312 l12,-20 l12,20 Z M200,312 l12,-20 l12,20 Z M230,312 l12,-20 l12,20 Z"
          fill="none" stroke="#111" stroke-width="2.5"/>
    <!-- decorations: wave -->
    <path d="M145,336 q14,-14 28,0 t28,0 t28,0" fill="none" stroke="#111" stroke-width="2.5"/>
    <!-- decorations: circles -->
    <circle cx="262" cy="300" r="5" fill="none" stroke="#111" stroke-width="2.5"/>
    <circle cx="278" cy="322" r="5" fill="none" stroke="#111" stroke-width="2.5"/>

    <!-- divider -->
    <line x1="40" y1="392" x2="360" y2="392" stroke="#111" stroke-width="2" stroke-dasharray="8,6"/>
    <text x="200" y="418" text-anchor="middle" font-size="15" font-style="italic" font-family="Verdana, sans-serif" fill="#111">Draw your own design on this one!</text>
    <!-- small free-draw yo-yo -->
    <line x1="200" y1="476" x2="200" y2="404" stroke="#111" stroke-width="3"/>
    <ellipse cx="200" cy="440" rx="62" ry="40" fill="#fff" stroke="#111" stroke-width="3"/>
    <ellipse cx="200" cy="530" rx="62" ry="40" fill="#fff" stroke="#111" stroke-width="3"/>
    <circle cx="200" cy="485" r="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  </svg>

  <div class="footer">dmvthrowers.club &middot; Free for classroom and homeschool use.</div>
</div>
</body>
</html>
